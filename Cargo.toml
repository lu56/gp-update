[package]
name = "gateway-policy"
version = "4.0.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
winreg = "0.52"
encoding_rs = "0.8"

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
